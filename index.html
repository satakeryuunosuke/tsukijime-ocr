<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>グッズ交換・月締めシステム</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon" href="public/assets/icon.png" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <header>
    <div class="head-row">
      <div>
        <h1>グッズ交換・月締めシステム <button type="button" class="help-btn help-btn-light" data-help="header_overview" title="システムの全体概要・使い方">?</button></h1>
        <p class="sub">交換票の読み取りから棚卸・レポート出力までブラウザで完結（オフライン・端末内処理）</p>
      </div>
      <div class="head-actions">
        <div class="ym-bar">
          <button id="ymPrev" class="ym-btn" title="前の月">◀</button>
          <label class="ym-label">対象年月 <input id="ymInput" type="text" placeholder="2026年07月" size="9" /><button type="button" class="help-btn help-btn-light help-btn-sm" data-help="header_ym" title="対象年月の選び方・自動判定ルール">?</button></label>
          <button id="ymNext" class="ym-btn" title="次の月">▶</button>
        </div>
        <div class="ai-btn-wrap" style="display:inline-flex; align-items:center; gap:.25rem;">
          <button id="aiReportBtn" class="ai-header-btn" title="AI相談用レポートをクリップボードにコピー (Ctrl+Shift+A)">
            🤖 <span>AI相談</span>
          </button>
          <button type="button" class="help-btn help-btn-light help-btn-sm" data-help="header_ai" title="AI相談機能の使い方・出力内容について">?</button>
        </div>
      </div>
    </div>
    <nav id="nav" class="nav">
      <a href="#home" data-view="home">ホーム</a>
      <a href="#reader" data-view="reader">読み取り</a>
      <a href="#carryover" data-view="carryover">繰越在庫</a>
      <a href="#arrivals" data-view="arrivals">入庫</a>
      <a href="#specials" data-view="specials">ノート購入</a>
      <a href="#cash" data-view="cash">現金管理</a>
      <a href="#closing" data-view="closing">月締め</a>
      <a href="#settings" data-view="settings">設定</a>
    </nav>
  </header>

  <main>
    <!-- ホーム -->
    <section id="view-home" class="view" hidden></section>

    <!-- 読み取り（AI-OCR） -->
    <section id="view-reader" class="view" hidden>
      <div class="view-head-wrap" style="display:flex; align-items:center; justify-content:space-between; margin-bottom:.75rem">
        <h2 class="view-title" style="margin:0">交換票の読み取り（AI-OCR） <button type="button" class="help-btn help-btn-lg" data-help="reader_overview" title="読み取り全体の流れ・取説">?</button></h2>
      </div>
      <section id="dropzone" class="dropzone">
        <p class="dz-title">交換票の PDF または 画像をドラッグ＆ドロップ <button type="button" class="help-btn help-btn-sm" data-help="reader_dropzone" title="ファイル選択・対応形式について">?</button></p>
        <p class="dz-or">または</p>
        <label class="btn">
          ファイルを選択
          <input id="fileInput" type="file" accept="application/pdf,image/*" multiple disabled hidden />
        </label>
        <p id="status" class="status">読み込み中…</p>
      </section>

      <div id="progressWrap" class="progress-wrap" hidden>
        <div id="progressBar" class="progress-bar"></div>
      </div>

      <section id="results" class="results" hidden>
        <div class="results-head">
          <div id="summary" class="summary"></div>
          <div class="dl">
            <button id="downloadBtn" class="btn" disabled>CSV ダウンロード</button>
            <button id="downloadAggBtn" class="btn" disabled>日別集計CSV</button>
            <button type="button" class="help-btn help-btn-sm" data-help="reader_csv_export" title="CSV出力について">?</button>
          </div>
        </div>
        <p id="savedInfo" class="status"></p>
        <section id="needFixWrap" class="needfix-panel" hidden>
          <div class="results-head">
            <h3 class="needfix-title">⚠ 対応が必要な読み取り結果 <button type="button" class="help-btn help-btn-sm" data-help="reader_needfix" title="要対応の確認・訂正方法について">?</button></h3>
            <div class="needfix-actions">
              <button id="approveLowBtn" class="btn-approve-low" hidden>✓ 低信頼度のみのページをまとめて承認</button>
              <button id="fixAllBtn" class="btn">まとめて修正</button>
            </div>
          </div>
          <table class="result-table">
            <thead>
              <tr><th>ページ</th><th>日付</th><th>認識結果</th><th>状態</th><th></th></tr>
            </thead>
            <tbody id="needFixBody"></tbody>
          </table>
        </section>
        <h3 class="okpages-title">確定した読み取り結果（自動保存） <button type="button" class="help-btn help-btn-sm" data-help="reader_approved" title="確定済みデータと自動保存について">?</button></h3>
        <table class="result-table">
          <thead>
            <tr><th>ページ</th><th>日付</th><th>認識結果</th><th>状態</th><th></th></tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </section>
    </section>

    <!-- 繰越在庫 -->
    <section id="view-carryover" class="view" hidden></section>

    <!-- 入庫 -->
    <section id="view-arrivals" class="view" hidden></section>

    <!-- ノート購入（現金・口座振替・ポイント） -->
    <section id="view-specials" class="view" hidden></section>

    <!-- 現金管理 -->
    <section id="view-cash" class="view" hidden></section>

    <!-- 月締め -->
    <section id="view-closing" class="view" hidden></section>

    <!-- 設定（検算桁数・商品マスタ・データ管理） -->
    <section id="view-settings" class="view" hidden></section>
  </main>

  <!-- ライブラリ（ローカル同梱・オフライン動作） -->
  <script>window.Module = { onRuntimeInitialized() { window.__CV_READY__ = true; } };</script>
  <script async src="public/assets/vendor/opencv.js"></script>
  <script src="public/assets/vendor/tf.min.js"></script>
  <script src="public/assets/vendor/pdf.min.js"></script>
  <script type="module" src="src/main.js"></script>
  <script>
    // Service Worker 登録（オフライン動作の有効化）。?nosw で無効化（開発用）。
    if ("serviceWorker" in navigator && !location.search.includes("nosw")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((e) => console.warn("SW登録失敗:", e));
      });
    }
  </script>
</body>
</html>
